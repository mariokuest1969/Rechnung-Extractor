openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: RE2026 - Invoice extraction and management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: invoices
    description: Invoice management operations
  - name: settings
    description: Application settings
  - name: lieferanten
    description: Supplier directory
  - name: buchungskonten
    description: Booking accounts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get current settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lieferanten:
    get:
      operationId: listLieferanten
      tags: [lieferanten]
      summary: List all suppliers
      responses:
        "200":
          description: Supplier list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lieferant"
    post:
      operationId: createLieferant
      tags: [lieferanten]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LieferantCreate"
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lieferant"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lieferanten/{id}:
    patch:
      operationId: updateLieferant
      tags: [lieferanten]
      summary: Update a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LieferantCreate"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lieferant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLieferant
      tags: [lieferanten]
      summary: Delete a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /buchungskonten:
    get:
      operationId: listBuchungskonten
      tags: [buchungskonten]
      summary: List all booking accounts
      responses:
        "200":
          description: Booking account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Buchungskonto"
    post:
      operationId: createBuchungskonto
      tags: [buchungskonten]
      summary: Create a booking account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuchungskontoCreate"
      responses:
        "201":
          description: Created booking account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Buchungskonto"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /buchungskonten/{id}:
    patch:
      operationId: updateBuchungskonto
      tags: [buchungskonten]
      summary: Update a booking account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuchungskontoCreate"
      responses:
        "200":
          description: Updated booking account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Buchungskonto"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBuchungskonto
      tags: [buchungskonten]
      summary: Delete a booking account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

  /invoices/stats:
    get:
      operationId: getInvoiceStats
      tags: [invoices]
      summary: Get invoice statistics
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceStats"

  /invoices/upload:
    post:
      operationId: uploadInvoices
      tags: [invoices]
      summary: Upload PDF invoices
      description: Upload one or more PDF files and extract invoice data using AI
      responses:
        "200":
          description: Extracted invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/extract-preview:
    post:
      operationId: extractPreview
      tags: [invoices]
      summary: Extract invoice data from PDF without saving
      description: Uploads PDFs and returns extracted data for review without persisting
      responses:
        "200":
          description: Extracted invoice previews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoicePreview"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/dropbox-link:
    get:
      operationId: getDropboxLink
      tags: [invoices]
      summary: Get a temporary download link for the Dropbox PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Temporary link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropboxLinkResponse"
        "400":
          description: No Dropbox file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}/reextract:
    post:
      operationId: reextractInvoice
      tags: [invoices]
      summary: Re-extract invoice data from Dropbox PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: No Dropbox file associated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/bulk-update:
    patch:
      operationId: bulkUpdateInvoices
      tags: [invoices]
      summary: Bulk update multiple invoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateBody"
      responses:
        "200":
          description: Updated count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/dropbox-sync:
    post:
      operationId: triggerDropboxSync
      tags: [invoices]
      summary: Trigger Dropbox sync
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropboxSyncResult"
        "500":
          description: Sync error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/dropbox-cleanup:
    post:
      operationId: triggerDropboxCleanup
      tags: [invoices]
      summary: Remove DB records for files deleted in Dropbox
      responses:
        "200":
          description: Cleanup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropboxCleanupResult"
        "500":
          description: Cleanup error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted successfully
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        openaiConfigured:
          type: boolean
      required:
        - status
        - openaiConfigured

    AppSettings:
      type: object
      required:
        - dropboxFolder
      properties:
        dropboxFolder:
          type: string
        dropboxTokenConfigured:
          type: boolean

    AppSettingsUpdate:
      type: object
      properties:
        dropboxFolder:
          type: string
        dropboxToken:
          type: ["string", "null"]

    DropboxCleanupResult:
      type: object
      required:
        - removed
        - checked
      properties:
        removed:
          type: integer
        checked:
          type: integer

    Lieferant:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        kuerzel:
          type: ["string", "null"]
        steuernummer:
          type: ["string", "null"]
        createdAt:
          type: string

    LieferantCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        kuerzel:
          type: ["string", "null"]
        steuernummer:
          type: ["string", "null"]

    Buchungskonto:
      type: object
      required:
        - id
        - kontonummer
        - bezeichnung
        - createdAt
      properties:
        id:
          type: integer
        kontonummer:
          type: string
        bezeichnung:
          type: string
        createdAt:
          type: string

    BuchungskontoCreate:
      type: object
      required:
        - kontonummer
        - bezeichnung
      properties:
        kontonummer:
          type: string
        bezeichnung:
          type: string

    Invoice:
      type: object
      required:
        - id
        - createdAt
      properties:
        id:
          type: integer
        rechnungssteller:
          type: ["string", "null"]
        datum:
          type: ["string", "null"]
        rechnungsnummer:
          type: ["string", "null"]
        bruttoBetrag:
          type: ["number", "null"]
        steuersatz:
          type: ["number", "null"]
        steuerBetrag:
          type: ["number", "null"]
        nettoBetrag:
          type: ["number", "null"]
        waehrung:
          type: ["string", "null"]
        bemerkung:
          type: ["string", "null"]
        freifeld1:
          type: ["string", "null"]
        freifeld2:
          type: ["string", "null"]
        freifeld3:
          type: ["string", "null"]
        lieferantId:
          type: ["integer", "null"]
        buchungskonto1:
          type: ["string", "null"]
        buchungskonto1Betrag:
          type: ["number", "null"]
        buchungskonto2:
          type: ["string", "null"]
        buchungskonto2Betrag:
          type: ["number", "null"]
        buchungstext:
          type: ["string", "null"]
        dateiname:
          type: ["string", "null"]
        dropboxFileId:
          type: ["string", "null"]
        createdAt:
          type: string

    InvoiceUpdate:
      type: object
      properties:
        rechnungssteller:
          type: ["string", "null"]
        datum:
          type: ["string", "null"]
        rechnungsnummer:
          type: ["string", "null"]
        bruttoBetrag:
          type: ["number", "null"]
        steuersatz:
          type: ["number", "null"]
        steuerBetrag:
          type: ["number", "null"]
        nettoBetrag:
          type: ["number", "null"]
        waehrung:
          type: ["string", "null"]
        bemerkung:
          type: ["string", "null"]
        freifeld1:
          type: ["string", "null"]
        freifeld2:
          type: ["string", "null"]
        freifeld3:
          type: ["string", "null"]
        lieferantId:
          type: ["integer", "null"]
        buchungskonto1:
          type: ["string", "null"]
        buchungskonto1Betrag:
          type: ["number", "null"]
        buchungskonto2:
          type: ["string", "null"]
        buchungskonto2Betrag:
          type: ["number", "null"]
        buchungstext:
          type: ["string", "null"]

    DropboxLinkResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string

    InvoicePreview:
      type: object
      required:
        - dateiname
      properties:
        dateiname:
          type: string
        rechnungssteller:
          type: ["string", "null"]
        datum:
          type: ["string", "null"]
        rechnungsnummer:
          type: ["string", "null"]
        bruttoBetrag:
          type: ["number", "null"]
        steuersatz:
          type: ["number", "null"]
        steuerBetrag:
          type: ["number", "null"]
        nettoBetrag:
          type: ["number", "null"]
        waehrung:
          type: ["string", "null"]
        bemerkung:
          type: ["string", "null"]

    BulkUpdateBody:
      type: object
      required:
        - ids
        - fields
      properties:
        ids:
          type: array
          items:
            type: integer
          description: Invoice IDs to update
        fields:
          type: object
          description: Fields to set on all selected invoices
          properties:
            rechnungssteller:
              type: ["string", "null"]
            lieferantId:
              type: ["integer", "null"]
            buchungskonto1:
              type: ["string", "null"]
            buchungskonto1Betrag:
              type: ["number", "null"]
            buchungskonto2:
              type: ["string", "null"]
            buchungskonto2Betrag:
              type: ["number", "null"]
            buchungstext:
              type: ["string", "null"]
            freifeld1:
              type: ["string", "null"]
            freifeld2:
              type: ["string", "null"]
            freifeld3:
              type: ["string", "null"]

    BulkUpdateResult:
      type: object
      required:
        - updated
      properties:
        updated:
          type: integer

    InvoiceStats:
      type: object
      required:
        - totalInvoices
        - totalBrutto
        - totalNetto
        - totalSteuer
        - byWaehrung
      properties:
        totalInvoices:
          type: integer
        totalBrutto:
          type: number
        totalNetto:
          type: number
        totalSteuer:
          type: number
        byWaehrung:
          type: array
          items:
            $ref: "#/components/schemas/WaehrungGroup"

    WaehrungGroup:
      type: object
      required:
        - waehrung
        - totalBrutto
        - count
      properties:
        waehrung:
          type: string
        totalBrutto:
          type: number
        count:
          type: integer

    DropboxSyncResult:
      type: object
      required:
        - imported
        - skipped
        - errors
        - folder
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
        folder:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
