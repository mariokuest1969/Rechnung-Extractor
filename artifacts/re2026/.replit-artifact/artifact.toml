kind = "web"
previewPath = "/"
title = "RE2026"
version = "1.0.0"
id = "artifacts/re2026"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21663

[services.development]
run = "pnpm --filter @workspace/re2026 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/re2026", "run", "build" ]
publicDir = "artifacts/re2026/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21663"
BASE_PATH = "/"
